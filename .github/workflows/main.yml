name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        mv docuscan-ai.txt project.zip || true
        unzip -o project.zip || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto Generate Gradle Wrapper if Missing
      run: |
        if [ ! -f "gradlew" ]; then
          echo "Generating Gradle Wrapper..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build APK
      run: |
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
