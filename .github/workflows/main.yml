name: Build App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ZIP फाइल को ऑटोमैटिक ढूंढकर package.json वाली लोकेशन को रूट में सेट करना
      - name: Auto Find and Unzip Code
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d temp_extracted
            
            # package.json की सटीक लोकेशन खोजना
            PKG_PATH=$(find temp_extracted -name "package.json" | head -n 1)
            if [ -n "$PKG_PATH" ]; then
              PKG_DIR=$(dirname "$PKG_PATH")
              echo "Moving files from $PKG_DIR to root..."
              cp -rn "$PKG_DIR"/* . 2>/dev/null || true
              cp -rn "$PKG_DIR"/.* . 2>/dev/null || true
            else
              echo "Error: package.json not found inside ZIP!"
            fi
            rm -rf temp_extracted
          else
            echo "Error: No ZIP file found in repository!"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init NewApp com.newapp.app --web-dir dist || npx cap init NewApp com.newapp.app --web-dir build
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "configurations.all { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22' }" >> android/app/build.gradle

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug -Pandroid.useAndroidX=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
