name: Build Android Native App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ZIP फाइल को अनज़िप करना
      - name: Unzip Native Android Project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d temp_extracted
            
            # gradlew या app/ फोल्डर की लोकेशन खोजना
            GRADLE_PATH=$(find temp_extracted -name "build.gradle*" -o -name "settings.gradle*" | head -n 1)
            if [ -n "$GRADLE_PATH" ]; then
              PROJ_DIR=$(dirname "$GRADLE_PATH")
              echo "Moving Android files from $PROJ_DIR to root..."
              cp -rn "$PROJ_DIR"/* . 2>/dev/null || true
              cp -rn "$PROJ_DIR"/.* . 2>/dev/null || true
            fi
            rm -rf temp_extracted
          fi

      # Android बिल्ड के लिए Java 21 सेट करना
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # Missing Keystore समस्या का हल
      - name: Generate Dummy Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore ~/.android/debug.keystore

      # Gradle Executable permissions
      - name: Make Gradlew Executable
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      # APK तैयार करना
      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon

      # APK डाउनलोड के लिए अपलोड करना
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-inpainter-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
