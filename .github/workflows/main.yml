name: Build App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # स्पेस वाली Zip फाइल को सीधा अनज़िप करने का सही तरीका
      - name: Find and Unzip Code
        run: |
          unzip -o "video-inpainter .zip" -d temp_extracted || unzip -o video-inpainter*.zip -d temp_extracted
          if [ -f "temp_extracted/package.json" ]; then
            cp -r temp_extracted/* .
          else
            INNER_PKG=$(find temp_extracted -name "package.json" | head -n 1)
            if [ -n "$INNER_PKG" ]; then
              INNER_DIR=$(dirname "$INNER_PKG")
              cp -r "$INNER_DIR"/* .
            fi
          fi
          rm -rf temp_extracted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Add Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init NewApp com.newapp.app --web-dir dist || npx cap init NewApp com.newapp.app --web-dir build
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin Duplicate Classes
        run: |
          echo "configurations.all { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22' }" >> android/app/build.gradle

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug -Pandroid.useAndroidX=true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
